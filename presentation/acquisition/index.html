<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050807" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>علووم | عرض الاستحواذ السري</title>
    <link rel="stylesheet" href="acquisition.css" />
  </head>
  <body>
    <main id="deck" class="deck" aria-live="polite"></main>

    <header class="topbar">
      <div class="brand"><b>علووم</b><span>ALOOM</span></div>
      <div class="confidential">عرض استحواذ سري وخاص</div>
    </header>

    <nav class="controls" aria-label="التحكم في العرض">
      <button id="next" class="round" aria-label="التالي">‹</button>
      <div class="progress">
        <span id="current">01</span><i><b id="bar"></b></i><span id="total">34</span>
      </div>
      <button id="prev" class="round" aria-label="السابق">›</button>
      <button id="menu" class="round menu" aria-label="فهرس الشرائح">☷</button>
      <button id="full" class="round" aria-label="ملء الشاشة">⛶</button>
    </nav>

    <aside id="indexPanel" class="index-panel" aria-label="فهرس الشرائح">
      <div class="index-head"><b>فهرس العرض</b><button id="closeMenu" aria-label="إغلاق">×</button></div>
      <div id="indexList" class="index-list"></div>
    </aside>

    <script src="acquisition.js"></script>
  </body>
</html>
